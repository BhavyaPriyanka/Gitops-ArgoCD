apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: localhelp-rds-credentials
  namespace: localhelp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: localhelp-rds-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:837206354502:secret:rds!db-eb2a8187-301c-4065-bac6-b1711abea23c-XPUcMt
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:837206354502:secret:rds!db-eb2a8187-301c-4065-bac6-b1711abea23c-XPUcMt
        property: password
