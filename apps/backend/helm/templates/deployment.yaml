apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: localhelp
  labels:
    app: backend
    purpose: deployment
    tier: backend-app
    project: localhelp
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: backend
      purpose: deployment
      tier: backend-app
      project: localhelp
  template:
    metadata:
      labels:
        app: backend
        purpose: deployment
        tier: backend-app
        project: localhelp
    spec:
      containers:
        - name: backend
          image: "{{ .Values.deployment.image }}:{{ .Values.deployment.imageVersion }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: localhelp-rds-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: localhelp-rds-credentials
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
