apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: localhelp-frontend
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/BhavyaPriyanka/Gitops-ArgoCD
    targetRevision: main
    path: apps/frontend/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: localhelp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true